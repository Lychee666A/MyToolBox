<h2>关于 Qt</h2>

<p>本程序使用 <b>Qt __QT_VERSION__</b> 开发。</p>

<p>Qt 是一个跨平台的 C++ 应用程序开发框架，由
<a href="https://www.qt.io/">The Qt Company</a> 及开源社区共同维护。</p>

<h3>Qt 的许可</h3>
<p>Qt 在开源版本下采用以下许可：</p>
<ul>
  <li>LGPLv3（大多数模块）</li>
  <li>GPLv3（部分模块）</li>
</ul>

<p>本程序动态链接 Qt 库，未对 Qt 进行修改。
根据 LGPLv3 要求，特此声明。</p>
